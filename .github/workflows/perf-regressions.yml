name: Performance fork regression tests

on:
  push:
    branches: ['perf/1.31.8']
  pull_request:
    branches: ['perf/1.31.8']

permissions:
  contents: read

concurrency:
  group: perf-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: '3.11'
          - runner: ubuntu-24.04-arm
            python: '3.12'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nginx/nginx
          ref: 140aa942711868a8daeb95810bc9a81f272ada72
          path: .perf-base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nginx/nginx-tests
          ref: 16964ee752509eb6271c4e8760e7899274240755
          path: .perf-tests
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install NGINX build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpcre2-dev libssl-dev zlib1g-dev libfcgi-perl
      - name: Build baseline and candidate with the same options
        run: |
          for dir in .perf-base .; do
            (cd "$dir" && auto/configure --with-http_ssl_module --with-http_v2_module --with-stream --with-threads --with-cc-opt=-O2 && make -j2)
          done
      - name: Run official HTTP and upstream tests
        run: bash docs/performance/check.sh .perf-tests "$PWD/objs/nginx"
      - name: Check UNIX sockets, upstream DNS reload and tunnel timeouts
        working-directory: .perf-tests
        env:
          TEST_NGINX_BINARY: ${{ github.workspace }}/objs/nginx
          TEST_NGINX_UNSAFE: '1'
        run: |
          prove -v -j1 geo_unix.t fastcgi_unix.t proxy_unix.t stream_geo_unix.t stream_unix.t \
            upstream_resolve.t upstream_resolve_reload.t tunnel_next_upstream.t
      - name: Exercise the native parser and upstream selector
        run: |
          python docs/performance/parser/prepare.py .perf-base .
          cc -O2 -Wall -Wextra docs/performance/parser/compare.c -o "$RUNNER_TEMP/check-parser"
          "$RUNNER_TEMP/check-parser"
          python docs/performance/upstream/check_random.py .perf-base .
          python docs/performance/upstream/check_random_routing.py .perf-base/objs/nginx objs/nginx
      - name: Compare HTTP responses and access logs
        env:
          SEED: '11192026'
        run: python docs/performance/parser/difffuzz.py "$PWD/.perf-base/objs/nginx" "$PWD/objs/nginx" 500
